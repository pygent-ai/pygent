[profile]
name = "synthetic-full"
backend = "synthetic"
scenarios = [
  "direct-invoke", "direct-stream", "local-invoke", "local-stream",
  "dynamic-model-invoke", "dynamic-model-stream",
  "react-tool-invoke", "react-tool-stream",
  "sqlite-durable-invoke", "sqlite-durable-stream",
  "http-worker-invoke", "http-worker-stream",
  "lifecycle-cancel-deadline",
]
concurrency = [1, 2, 4, 8, 16, 32, 64, 128]
closed_duration_seconds = 60.0
open_multipliers = [0.5, 0.75, 0.9, 1.1, 1.3]
open_duration_seconds = 60.0
warmup_seconds = 10.0
cooldown_seconds = 2.0
repetitions = 3
max_inflight = 256
request_deadline_seconds = 60.0
seed = 1729

[model]
latency_ms = 25.0
jitter_ms = 3.0
ttft_ms = 5.0
chunks = 3
tool_latency_ms = 2.0
